name: Refresh jobs and deploy map
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: jobmap-production
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify normalization and lifecycle rules
        run: node --test scripts/*.test.mjs worker/test/*.test.mjs
      - name: Refresh public employer feeds
        run: node scripts/refresh.mjs
      - name: Save current snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh employer job listings"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prepare public website
        run: |
          mkdir -p _site/data _site/vendor
          cp index.html style.css app.js age.mjs us-states.mjs energy.mjs application.js application.css backend-config.js icon.svg jobs-for-dave.jpg _site/
          cp data/jobs.json _site/data/
          cp vendor/leaflet.js vendor/leaflet.css vendor/LEAFLET-LICENSE vendor/US-ATLAS-LICENSE _site/vendor/
          cp -R vendor/profile _site/vendor/profile
          node scripts/version-assets.mjs _site "$(git rev-parse HEAD)"
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish job map
        id: deployment
        uses: actions/deploy-pages@v4
